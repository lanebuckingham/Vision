services:
  postgres:
    image: postgres:17-alpine
    container_name: vision-postgres
    environment:
      POSTGRES_DB: vision
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision_dev
    ports:
      - "5432:5432"
    volumes:
      - vision-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  vision-pgdata:
